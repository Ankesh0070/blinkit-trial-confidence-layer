<style>
        .star-rating .material-symbols-outlined {
            font-variation-settings: 'FILL' 1;
            cursor: pointer;
            transition: color 0.2s ease-in-out, transform 0.1s ease-in-out;
        }
        .star-rating .material-symbols-outlined:hover,
        .star-rating .material-symbols-outlined.active {
            color: #f7d032; /* primary-container */
            transform: scale(1.1);
        }
        .toast-enter {
            animation: slideUp 0.3s ease-out forwards;
        }
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>

<body class="bg-background text-on-background min-h-screen flex flex-col items-center p-margin-mobile md:p-margin-desktop font-body-md antialiased">
<!-- TopAppBar (Suppressed as this is a focused form component, but keeping shell logic ready if needed) -->
<header class="hidden md:flex bg-primary-container dark:bg-primary text-on-primary-container dark:text-on-primary docked full-width top-0 shadow-sm flex-col w-full px-margin-mobile py-sm gap-xs mb-xl rounded-xl">
<div class="flex items-center justify-between w-full">
<div class="flex items-center gap-xs">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">location_on</span>
<span class="font-headline-md text-headline-md font-black text-on-background dark:text-background">Delivery in 10 minutes</span>
</div>
<div class="flex items-center gap-xs text-on-primary-container dark:text-on-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">shopping_cart</span>
</div>
</div>
</header>
<main class="w-full max-w-2xl mx-auto flex-grow flex flex-col gap-lg">
<!-- Write a Review Form Card -->
<section class="bg-surface-container-lowest rounded-xl border border-secondary shadow-[0px_4px_12px_rgba(0,0,0,0.05)] p-md md:p-lg flex flex-col gap-sm relative">
<div class="flex flex-col gap-base">
<h2 class="font-headline-sm text-headline-sm text-on-surface">Share your experience</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Your feedback helps us improve and helps others make better choices.</p>
</div>
<!-- Star Rating -->
<div class="flex items-center gap-xs py-sm star-rating">
<span class="material-symbols-outlined text-tertiary-container text-4xl" data-value="1">star</span>
<span class="material-symbols-outlined text-tertiary-container text-4xl" data-value="2">star</span>
<span class="material-symbols-outlined text-tertiary-container text-4xl" data-value="3">star</span>
<span class="material-symbols-outlined text-tertiary-container text-4xl" data-value="4">star</span>
<span class="material-symbols-outlined text-tertiary-container text-4xl" data-value="5">star</span>
</div>
<!-- Textarea -->
<div class="flex flex-col gap-xs">
<textarea class="w-full bg-surface border border-outline-variant rounded-lg p-sm font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none resize-none" id="review-text" maxlength="500" placeholder="What did you like or dislike?" rows="4"></textarea>
<div class="flex justify-end">
<span class="font-label-sm text-label-sm text-on-surface-variant" id="char-count">0 / 500</span>
</div>
</div>
<!-- Action Buttons -->
<div class="flex justify-end gap-sm mt-sm">
<button class="px-md py-xs rounded-lg font-label-lg text-label-lg border border-outline-variant text-on-surface-variant hover:bg-surface-variant transition-colors bg-surface-container-lowest">
                    Cancel
                </button>
<button class="px-md py-xs rounded-lg font-label-lg text-label-lg bg-on-background text-on-primary hover:bg-inverse-surface transition-colors" id="submit-review">
                    Submit
                </button>
</div>
</section>
</main>
<!-- Bottom Toast Notification (Hidden initially) -->
<div class="fixed bottom-margin-mobile left-1/2 -translate-x-1/2 bg-secondary text-on-secondary px-md py-sm rounded-lg shadow-lg flex items-center gap-xs font-label-lg text-label-lg z-50 opacity-0 pointer-events-none transition-opacity duration-300" id="toast">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
        Review posted — thank you!
    </div>
<!-- Script for interactivity -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const stars = document.querySelectorAll('.star-rating .material-symbols-outlined');
            const textarea = document.getElementById('review-text');
            const charCount = document.getElementById('char-count');
            const submitBtn = document.getElementById('submit-review');
            const toast = document.getElementById('toast');
            let currentRating = 0;

            // Star Rating Logic
            stars.forEach(star => {
                star.addEventListener('click', (e) => {
                    currentRating = parseInt(e.target.dataset.value);
                    updateStars(currentRating);
                });
                star.addEventListener('mouseenter', (e) => {
                    const hoverValue = parseInt(e.target.dataset.value);
                    updateStars(hoverValue, true);
                });
                star.addEventListener('mouseleave', () => {
                    updateStars(currentRating);
                });
            });

            function updateStars(value, isHover = false) {
                stars.forEach(s => {
                    const starVal = parseInt(s.dataset.value);
                    if (starVal <= value) {
                        s.classList.add('active');
                        s.classList.remove('text-tertiary-container');
                    } else {
                        s.classList.remove('active');
                        s.classList.add('text-tertiary-container');
                    }
                });
            }

            // Character Counter
            textarea.addEventListener('input', (e) => {
                const length = e.target.value.length;
                charCount.textContent = `${length} / 500`;
            });

            // Submit & Toast
            submitBtn.addEventListener('click', () => {
                // Show toast
                toast.classList.remove('opacity-0', 'pointer-events-none');
                toast.classList.add('toast-enter');
                
                // Hide after 3 seconds
                setTimeout(() => {
                    toast.classList.add('opacity-0', 'pointer-events-none');
                    toast.classList.remove('toast-enter');
                    // Reset form
                    currentRating = 0;
                    updateStars(0);
                    textarea.value = '';
                    charCount.textContent = '0 / 500';
                }, 3000);
            });
        });
    </script>
</body></html>
