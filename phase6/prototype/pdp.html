<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            color: #334155;
            text-align: center;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            max-width: 400px;
        }
        h1 { margin-top: 0; font-size: 1.25rem; }
        p { margin-bottom: 1.5rem; font-size: 0.95rem; line-height: 1.5; }
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #facc15;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <h1>Navigation Update</h1>
        <p>The Product Details Page (PDP) has been upgraded to an integrated Bottom Sheet in the new UI.</p>
        <div class="spinner"></div>
        <p style="margin-top: 1rem; font-size: 0.85rem; color: #64748b;">Redirecting you to the Store UI...</p>
    </div>

    <script>
        setTimeout(() => {
            window.location.href = 'index.html';
        }, 3000);
    </script>
</body>
</html>
